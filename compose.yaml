# Aureon_Agentic — Phase 1.
# Joins the EXISTING private-ai Docker network(s) to reach the existing Postgres and Ollama
# containers. Only the API is published, and only on 127.0.0.1.
#
# Fill these from docs/00-inspection.md (see .env.example):
#   PRIVATE_AI_NETWORK  — the network the Postgres + Ollama containers are on
name: aureon

# Hardening shared by every service (docs/16-production-hardening.md): bounded json-file logs,
# no privilege escalation, no Linux capabilities. Merged in with `<<: *hardened`.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardened: &hardened
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true

# Worker liveness: the agent heartbeat file on the container's own /tmp (app/workers/healthcheck.py).
x-worker-health: &worker-health
  test: ["CMD", "python", "-m", "app.workers.healthcheck", "--max-age", "90"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

# Boot order: mount-check → redis (healthy) → migrate (exit 0) → api (healthy) → workers.
# The existing Postgres container is in another compose project; `migrate` waits for it.
x-after-api: &after-api
  mount-check: { condition: service_completed_successfully }
  redis: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }
  api: { condition: service_healthy }

x-data-root: &data-root
  type: bind
  source: ${DATA_ROOT:-/mnt/spasta-data}
  target: /mnt/spasta-data
  bind:
    create_host_path: false   # fail instead of silently creating an empty dir on the SSD

# Read-only view of the HDD (Phase 22): the scheduler reads the backup status file for alerts.
x-data-root-ro: &data-root-ro
  type: bind
  source: ${DATA_ROOT:-/mnt/spasta-data}
  target: /mnt/spasta-data
  read_only: true
  bind:
    create_host_path: false

services:
  # Gate: exits non-zero unless the HDD is really mounted (marker file present).
  # api depends on it completing successfully, so compose refuses to start the API.
  mount-check:
    image: busybox:1.36.1
    command:
      - sh
      - -c
      - >
        test -f /mnt/spasta-data/${DATA_ROOT_MARKER:-.spasta-data-mounted}
        || { echo "FATAL: /mnt/spasta-data is not mounted (marker missing)"; exit 1; }
    volumes: [*data-root]
    network_mode: none
    <<: *hardened
    mem_limit: 32m
    cpus: "0.1"
    restart: "no"

  redis:
    image: redis:7.4-alpine
    container_name: aureon-redis
    # Runs as the image's redis user (999) directly, so the entrypoint needs no chown/gosu and
    # every capability can be dropped. /mnt/spasta-data/redis must be owned by 999:999.
    user: "999:999"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb",
              "--maxmemory-policy", "noeviction"]
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/mnt/spasta-data}/redis
        target: /data
        bind: { create_host_path: false }
    networks: [aureon]
    # NO ports: Redis is never published.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    <<: *hardened
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 384m
    cpus: "0.5"
    depends_on:
      mount-check: { condition: service_completed_successfully }
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime   # the last stage is the opt-in imaging worker
    image: aureon-agentic:${IMAGE_TAG:-dev}
    container_name: aureon-api
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    volumes: [*data-root]
    networks: [aureon, private-ai, aureon-docker]
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; Nginx/cloudflared reach it locally
    <<: *hardened
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    depends_on:
      mount-check: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # Image worker (Phase 4). Opt-in profile: start it only after IMAGE_AGENT_COMMAND is set
  # from the /opt/image-agent inspection. `docker compose --profile imaging up -d --build`.
  # Built from the `imaging` Dockerfile target, which pip-installs the image-agent's OWN
  # requirements file (torch CPU etc.) from /opt/image-agent; no model is downloaded.
  imaging-worker:
    build:
      context: .
      target: imaging
      additional_contexts:
        imageagent: ${IMAGE_AGENT_PATH:-/opt/image-agent}
      args:
        IMAGE_AGENT_REQUIREMENTS: ${IMAGE_AGENT_REQUIREMENTS:-requirements.txt}
        IMAGE_AGENT_PIP: ${IMAGE_AGENT_PIP:-true}
    image: aureon-imaging:${IMAGE_TAG:-dev}
    container_name: aureon-imaging
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.imaging"]
    volumes:
      - *data-root
      - type: bind
        source: ${IMAGE_AGENT_PATH:-/opt/image-agent}
        target: ${IMAGE_AGENT_PATH:-/opt/image-agent}
        read_only: true
        bind: { create_host_path: false }
    networks: [aureon, private-ai]
    # NO ports. One generation at a time; leave a core for Postgres/API/Ollama.
    cpus: "3.0"
    mem_limit: 10g
    <<: *hardened
    tmpfs: ["/tmp:size=2g"]
    healthcheck: *worker-health
    stop_grace_period: 30s   # SIGTERM → running job is stopped and re-queued
    depends_on: *after-api
    profiles: [imaging]
    restart: unless-stopped

  # Scheduler worker (Phase 5): cron jobs from agents.scheduled_jobs, retries + backoff.
  scheduler:
    image: aureon-agentic:${IMAGE_TAG:-dev}
    container_name: aureon-scheduler
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.scheduler"]
    volumes: [*data-root-ro]   # backup status for alerts_dispatch (docs/24); read-only
    networks: [aureon, private-ai]
    # NO ports.
    <<: *hardened
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 512m
    cpus: "1.0"
    healthcheck: *worker-health
    stop_grace_period: 30s
    depends_on: *after-api
    restart: unless-stopped

  # Dhan live market feed (Trading Phase B). Opt-in: `docker compose --profile dhan up -d`.
  # Its own process, never sharing one with the API, Ollama or imaging workers.
  dhan-feed:
    image: aureon-agentic:${IMAGE_TAG:-dev}
    container_name: aureon-dhan-feed
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.dhan_feed"]
    networks: [aureon, private-ai]   # Redis + Postgres; outbound to api-feed.dhan.co
    # NO ports.
    <<: *hardened
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 512m
    cpus: "1.0"
    healthcheck: *worker-health
    stop_grace_period: 15s
    depends_on: *after-api
    profiles: [dhan]
    restart: unless-stopped

  # Research agents (Trading Phase D): market data, indicators, signals, risk, backtests and
  # Ollama explanations, in their own process. Opt-in: `docker compose --profile research up -d`.
  # Never places orders. One CPU-heavy backtest at a time; Ollama calls are serialized.
  research-worker:
    image: aureon-agentic:${IMAGE_TAG:-dev}
    container_name: aureon-research
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.research"]
    networks: [aureon, private-ai]   # Redis + Postgres + Ollama (+ outbound to the broker APIs)
    # NO ports.
    <<: *hardened
    tmpfs: ["/tmp:size=64m"]
    cpus: "1.5"
    mem_limit: 1g
    healthcheck: *worker-health
    stop_grace_period: 20s
    depends_on: *after-api
    profiles: [research]
    restart: unless-stopped

  # Coding agent (Phase 5b): patch tasks in isolated git worktrees, allowlisted test commands,
  # never merges or deploys. Git ops (docs/05-agents.md): clones of GITHUB_CODING_REPO_ALLOWLIST
  # live under CODE_CLONE_ROOT on the data-root volume below; pushes go to feature branches only.
  # Opt-in: `docker compose --profile coding up -d --build`.
  # CODE_REPOS paths must live under CODE_REPOS_ROOT (mounted read-write at the same path,
  # because git records worktrees and task branches inside each repo's .git).
  # Gate for the coding profile only (it must not block the API): the repos dir exists and both
  # it and the HDD worktree dir are writable by the worker's uid (10001). A missing repos dir is
  # refused by the bind itself (create_host_path: false), so compose names the path.
  coding-mount-check:
    image: busybox:1.36.1
    user: "10001"
    command:
      - sh
      - -c
      - >
        test -f /mnt/spasta-data/${DATA_ROOT_MARKER:-.spasta-data-mounted}
        || { echo "FATAL: /mnt/spasta-data is not mounted (marker missing)"; exit 1; };
        for d in "${CODE_REPOS_ROOT:-/opt/private-ai/repos}" /mnt/spasta-data/code-worktrees; do
        t="$$d/.aureon-write-check";
        touch "$$t" 2>/dev/null && rm -f "$$t"
        || { echo "FATAL: $$d is not writable by uid 10001 (docs/manual-setup.md, step 0)"; exit 1; };
        done; echo "coding mounts OK"
    volumes:
      - *data-root
      - type: bind
        source: ${CODE_REPOS_ROOT:-/opt/private-ai/repos}
        target: ${CODE_REPOS_ROOT:-/opt/private-ai/repos}
        bind: { create_host_path: false }
    network_mode: none
    <<: *hardened
    mem_limit: 32m
    cpus: "0.1"
    profiles: [coding]
    restart: "no"

  coding-worker:
    build:
      context: .
      target: coding
    image: aureon-coding:${IMAGE_TAG:-dev}
    container_name: aureon-coding
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.coding"]
    volumes:
      - *data-root                      # worktrees under /mnt/spasta-data/code-worktrees
      - type: bind
        source: ${CODE_REPOS_ROOT:-/opt/private-ai/repos}
        target: ${CODE_REPOS_ROOT:-/opt/private-ai/repos}
        bind: { create_host_path: false }
    # Postgres + Ollama only. NOT on "aureon": the tests it runs execute model-patched code,
    # which must not reach Redis or the Docker proxy (container env = every secret).
    networks: [private-ai]
    # NO ports.
    <<: *hardened
    tmpfs: ["/tmp:size=1g"]
    cpus: "2.0"
    mem_limit: 3g
    healthcheck: *worker-health
    stop_grace_period: 30s
    depends_on:
      <<: *after-api
      coding-mount-check: { condition: service_completed_successfully }
    profiles: [coding]
    restart: unless-stopped

  # GitHub webhook worker (Phase 17, docs/20-github-actions-webhooks.md): processes the
  # deliveries POST /api/v1/github/webhooks stored and queued on Redis. Same image as the
  # scheduler. Opt-in: `docker compose --profile github up -d`.
  github-webhook-worker:
    image: aureon-agentic:${IMAGE_TAG:-dev}
    container_name: aureon-github-webhooks
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.github_webhooks"]
    networks: [aureon, private-ai]   # Redis + Postgres
    # NO ports.
    <<: *hardened
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 256m
    cpus: "0.5"
    healthcheck: *worker-health
    stop_grace_period: 15s
    depends_on: *after-api
    profiles: [github]
    restart: unless-stopped

  # Read-only Docker API for GET /api/system/status. The API never mounts docker.sock
  # (any socket mount, even :ro, is root-equivalent). This proxy allows only GET
  # /containers/*; every write (POST/DELETE) and every other endpoint is refused.
  # Pin to a tag you have verified exists before deploying.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: aureon-docker-proxy
    environment:
      CONTAINERS: "1"
      POST: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      INFO: "0"
      EVENTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Its own internal network shared ONLY with the API: GET /containers/{id}/json returns each
    # container's env (every secret), so no worker may reach it. NO ports.
    networks: [aureon-docker]
    <<: *hardened
    # The image's entrypoint renders /usr/local/etc/haproxy/haproxy.cfg from its template at
    # every start, so the root filesystem cannot be read-only (it exits "Read-only file system").
    # A tmpfs there would hide the template. Caps stay dropped; no-new-privileges stays on.
    read_only: false
    # HAProxy runs as root inside (to read the socket) and binds 2375 (> 1024): no caps needed.
    tmpfs: [/run, /tmp]
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # One-shot on every `up`: waits for the existing Postgres, then `alembic upgrade head`
  # (additive, idempotent at head). The API starts only after it exits 0.
  # Ad-hoc: `docker compose run --rm migrate` (same) or `... migrate <other command>`.
  migrate:
    image: aureon-agentic:${IMAGE_TAG:-dev}
    # Phase 22: MIGRATIONS_DATABASE_URL (the aureon_migrator role) lives in .env.migrate, so
    # only this one-shot ever sees the schema owner's password. Missing file = DATABASE_URL.
    env_file:
      - path: .env
      - path: .env.migrate
        required: false
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.migrate"]
    networks: [private-ai]
    # NO ports.
    healthcheck: { disable: true }   # the image's API healthcheck does not apply to a one-shot
    <<: *hardened
    tmpfs: ["/tmp:size=32m"]
    mem_limit: 512m
    cpus: "1.0"
    depends_on:
      redis: { condition: service_healthy }
    restart: "no"

networks:
  aureon:
    name: aureon
  aureon-docker:
    name: aureon-docker
    internal: true   # no route out; only the API and the read-only Docker proxy are on it
  private-ai:
    external: true
    name: ${PRIVATE_AI_NETWORK:?set PRIVATE_AI_NETWORK in .env (see docs/00-inspection.md)}
