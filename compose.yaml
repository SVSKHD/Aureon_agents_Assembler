# Aureon_Agentic — Phase 1.
# Joins the EXISTING private-ai Docker network(s) to reach the existing Postgres and Ollama
# containers. Only the API is published, and only on 127.0.0.1.
#
# Fill these from docs/00-inspection.md (see .env.example):
#   PRIVATE_AI_NETWORK  — the network the Postgres + Ollama containers are on
name: aureon

x-data-root: &data-root
  type: bind
  source: ${DATA_ROOT:-/mnt/spasta-data}
  target: /mnt/spasta-data
  bind:
    create_host_path: false   # fail instead of silently creating an empty dir on the SSD

services:
  # Gate: exits non-zero unless the HDD is really mounted (marker file present).
  # api depends on it completing successfully, so compose refuses to start the API.
  mount-check:
    image: busybox:1.36.1
    command:
      - sh
      - -c
      - >
        test -f /mnt/spasta-data/${DATA_ROOT_MARKER:-.spasta-data-mounted}
        || { echo "FATAL: /mnt/spasta-data is not mounted (marker missing)"; exit 1; }
    volumes: [*data-root]
    network_mode: none
    restart: "no"

  redis:
    image: redis:7.4-alpine
    container_name: aureon-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb",
              "--maxmemory-policy", "noeviction"]
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/mnt/spasta-data}/redis
        target: /data
        bind: { create_host_path: false }
    networks: [aureon]
    # NO ports: Redis is never published.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      mount-check: { condition: service_completed_successfully }
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime   # the last stage is the opt-in imaging worker
    image: aureon-agentic:${IMAGE_TAG:-dev}
    container_name: aureon-api
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    volumes: [*data-root]
    networks: [aureon, private-ai]
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; Nginx/cloudflared reach it locally
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s
    depends_on:
      mount-check: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Image worker (Phase 4). Opt-in profile: start it only after IMAGE_AGENT_COMMAND is set
  # from the /opt/image-agent inspection. `docker compose --profile imaging up -d --build`.
  # Built from the `imaging` Dockerfile target, which pip-installs the image-agent's OWN
  # requirements file (torch CPU etc.) from /opt/image-agent; no model is downloaded.
  imaging-worker:
    build:
      context: .
      target: imaging
      additional_contexts:
        imageagent: ${IMAGE_AGENT_PATH:-/opt/image-agent}
      args:
        IMAGE_AGENT_REQUIREMENTS: ${IMAGE_AGENT_REQUIREMENTS:-requirements.txt}
    image: aureon-imaging:${IMAGE_TAG:-dev}
    container_name: aureon-imaging
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.imaging"]
    volumes:
      - *data-root
      - type: bind
        source: ${IMAGE_AGENT_PATH:-/opt/image-agent}
        target: ${IMAGE_AGENT_PATH:-/opt/image-agent}
        read_only: true
        bind: { create_host_path: false }
    networks: [aureon, private-ai]
    # NO ports. One generation at a time; leave a core for Postgres/API/Ollama.
    cpus: "3.0"
    mem_limit: 10g
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s   # SIGTERM → running job is stopped and re-queued
    depends_on:
      mount-check: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    profiles: [imaging]
    restart: unless-stopped

  # Scheduler worker (Phase 5): cron jobs from agents.scheduled_jobs, retries + backoff.
  scheduler:
    image: aureon-agentic:${IMAGE_TAG:-dev}
    container_name: aureon-scheduler
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.scheduler"]
    networks: [aureon, private-ai]
    # NO ports.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  # Dhan live market feed (Trading Phase B). Opt-in: `docker compose --profile dhan up -d`.
  # Its own process, never sharing one with the API, Ollama or imaging workers.
  dhan-feed:
    image: aureon-agentic:${IMAGE_TAG:-dev}
    container_name: aureon-dhan-feed
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
    command: ["python", "-m", "app.workers.dhan_feed"]
    networks: [aureon, private-ai]   # Redis + Postgres; outbound to api-feed.dhan.co
    # NO ports.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    stop_grace_period: 15s
    depends_on:
      redis: { condition: service_healthy }
    profiles: [dhan]
    restart: unless-stopped

  # Read-only Docker API for GET /api/system/status. The API never mounts docker.sock
  # (any socket mount, even :ro, is root-equivalent). This proxy allows only GET
  # /containers/*; every write (POST/DELETE) and every other endpoint is refused.
  # Pin to a tag you have verified exists before deploying.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: aureon-docker-proxy
    environment:
      CONTAINERS: "1"
      POST: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      INFO: "0"
      EVENTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [aureon]   # internal only; NO ports
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # One-shot: `docker compose run --rm migrate`
  migrate:
    image: aureon-agentic:${IMAGE_TAG:-dev}
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    networks: [private-ai]
    profiles: [tools]
    restart: "no"

networks:
  aureon:
    name: aureon
  private-ai:
    external: true
    name: ${PRIVATE_AI_NETWORK:?set PRIVATE_AI_NETWORK in .env (see docs/00-inspection.md)}
