[project]
name = "aureon-agentic"
version = "0.1.0"
description = "Aureon_Agentic: self-hosted modular-monolith backend for Spasta (FastAPI + PostgreSQL + Redis + Ollama)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "cryptography>=42",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "argon2-cffi>=23.1",
    "psutil>=6.0",
    "croniter>=3.0",
    "tzdata>=2024.1",
    "websockets>=13.0",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    # Direct AI provider APIs (docs/26-ai-providers.md). Official SDKs; anthropic 2.x sends
    # anthropic-version 2026-10-21 and runs on httpx2.
    "anthropic>=2.4,<3",
    "google-genai>=2.34,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psutil",
    "types-croniter",
    "pandas-stubs",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: requires TEST_DATABASE_URL (isolated test database)"]
