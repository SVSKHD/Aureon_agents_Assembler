[project]
name = "aureon-agentic"
version = "0.1.0"
description = "Aureon_Agentic: self-hosted modular-monolith backend for Spasta (FastAPI + PostgreSQL + Redis + Ollama)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "cryptography>=42",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "argon2-cffi>=23.1",
    "psutil>=6.0",
    "croniter>=3.0",
    "tzdata>=2024.1",
    "websockets>=13.0",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "python-multipart>=0.0.9",
    # Reads .xlsx files attached to an AI chat message (app/services/chat_attachments.py).
    "openpyxl>=3.1,<4",
    "pyjwt[crypto]>=2.8",
    # Claude, the only AI provider (docs/26-ai-providers.md). anthropic 2.x sends
    # anthropic-version 2026-10-21 and runs on httpx2. Imported only by app/ai/gateway.py.
    "anthropic>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psutil",
    "types-croniter",
    "pandas-stubs",
    "types-openpyxl",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Aureon V1.6.3 code kept byte-for-byte as shipped (docs/34): the strategy modules the
# Assembler runs, and the Windows client the compatibility test drives. Not reformatted, so a
# diff against the V1.6.3 package stays empty.
extend-exclude = [
    "alembic/versions",
    "app/aureon/indicators.py",
    "app/aureon/matcher.py",
    "app/aureon/positions.py",
    "tests/fixtures/aureon_v163",
    "tests/fixtures/aureon_v164",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# Aureon V1.6.3 ports: operator messages, report text and SQL kept as V1.6.3 wrote them.
"app/aureon/*.py" = ["E501", "RUF001", "RUF002", "RUF003", "UP031"]
"tests/test_aureon_*.py" = ["S", "B", "E501", "RUF001"]
"tests/test_admin_password_reset_db.py" = ["S", "B", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "tests/fixtures/aureon_v163/", "tests/fixtures/aureon_v164/"]

[[tool.mypy.overrides]]
# Aureon V1.6.3 strategy code, kept byte-for-byte as shipped (untyped, see docs/34).
module = ["app.aureon.indicators", "app.aureon.matcher", "app.aureon.positions"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.aureon.weekend_review", "app.aureon.sunday_review", "app.aureon.detector"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: requires TEST_DATABASE_URL (isolated test database)"]
