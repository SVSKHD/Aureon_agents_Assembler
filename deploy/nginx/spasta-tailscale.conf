# svskhd8.taila439d5.ts.net: Spasta privately over Tailscale (tailnet devices only).
#
#   phone/laptop on the tailnet --HTTPS--> tailscale serve --> http://127.0.0.1:8088 (this block)
#
# Tailscale Serve terminates TLS (a ts.net certificate) and forwards with the ts.net Host
# header. The tailnet is the network boundary here, so there is no Cloudflare Access JWT gate
# (that header only exists behind Cloudflare). The app's own auth still applies: every
# protected endpoint needs the session cookie, and every write needs the CSRF header. Only
# /api/health (liveness, no detail) and the app's /api/public/* answer without a login.
#
# Same SPA and same-origin /api/ as spasta-online.conf, so the __Host- SameSite=Strict
# session and CSRF cookies work on this hostname too (they are host-only).
#
# Tailscale Serve adds Tailscale-User-Login / -Name to requests from tailnet users. They reach
# the app as ordinary request headers; nothing treats them as authentication.
#
# Install (sudo):
#   sudo ln -s /opt/private-ai/aureon/deploy/nginx/spasta-tailscale.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 127.0.0.1:8088;
    server_name svskhd8.taila439d5.ts.net;

    root /srv/www/spasta/current;
    index index.html;

    # CSP stays restrictive (connect-src 'self'); /api/health/ready stays 404 (on-box only).
    include /opt/private-ai/aureon/deploy/nginx/security-headers.conf;
    include /opt/private-ai/aureon/deploy/nginx/aureon-api.conf;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
