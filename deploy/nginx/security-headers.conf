# Security headers for the Spasta SPA server block (Phase E, docs/17-security-review.md).
#
# Include ONCE at SERVER level of the existing frontend server { } (next to the
# aureon-api.conf include):
#
#     include /opt/private-ai/aureon/deploy/nginx/security-headers.conf;
#
# nginx only inherits add_header into a location that sets NO add_header of its own, so
# aureon-api.conf repeats the API-relevant ones inside location /api/.
# Check the SPA after enabling: if it loads fonts/scripts from a CDN, add that origin to the
# matching directive (start with Content-Security-Policy-Report-Only if unsure).

# HTTPS only for a year (spasta.online is served over TLS via Cloudflare). Do not add
# `preload` unless every subdomain is HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# microphone=(self): the SPA's own pages may ask for the mic (AI-chat dictation and voice
# navigation, docs/23-approval-engine.md). With microphone=() the browser refuses before any
# prompt: Chrome's SpeechRecognition fails with "not-allowed" and getUserMedia rejects, so the
# mic button did nothing. Still no third-party frame may use it, and camera etc. stay off.
# The Web Speech API needs no CSP change (the browser talks to its recogniser itself; no
# fetch, blob: or worker from the page), so connect-src stays 'self'.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
server_tokens off;
