# Route /api/* on the Spasta site to the Aureon API on 127.0.0.1:8000 (Phase 6).
#
# Include this inside the EXISTING server { } block that serves the frontend (the one on
# :8088 / behind cloudflared for spasta.online), BEFORE its catch-all `location /`:
#
#     include /opt/private-ai/aureon/deploy/nginx/aureon-api.conf;
#
# Same origin for the SPA and the API is required: the session and CSRF cookies are
# SameSite=Strict and __Host- prefixed. Nothing else in the server block changes.
# Also include security-headers.conf at server level for the SPA (Phase E).

# Readiness detail (Postgres version, model count) is for on-box monitoring only:
# scripts/ops/healthcheck.sh and the compose healthchecks call 127.0.0.1:8000 directly.
location = /api/health/ready {
    return 404;
}

# Receipt uploads (POST /api/finance/attachments): FINANCE_ATTACHMENT_MAX_BYTES (10 MiB) + 1 MiB
# of multipart overhead. Every other /api/ request keeps the 2 MB limit below.
location = /api/finance/attachments {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_request_buffering off;
    client_max_body_size 11m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location /api/ {
    proxy_pass http://127.0.0.1:8000;          # no trailing slash: keep the /api prefix
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Server-Sent Events (chat tokens, /api/trading/stream): never buffer, long reads.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    client_max_body_size 2m;

    # A location with its own add_header inherits none from the server block, so the API
    # repeats them here (the app also sets nosniff/frame/referrer/CSP on every response).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    proxy_hide_header X-Powered-By;
}
