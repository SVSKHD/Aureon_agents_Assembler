# spasta.online: the Vue SPA plus same-origin /api/ (host nginx, behind cloudflared).
# cloudflared sends every hostname to 127.0.0.1:8088 with the right Host header
# (deploy/cloudflare/config.yml.example); api.spasta.online is api-spasta-online.conf.
#
# Install (sudo):
#   sudo ln -s /opt/private-ai/aureon/deploy/nginx/spasta-online.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The web root is a symlink swapped atomically by ASTRA-FRONTEND scripts/deploy.sh:
#   /srv/www/spasta/current -> releases/<sha>
server {
    listen 127.0.0.1:8088;
    server_name spasta.online;

    root /srv/www/spasta/current;
    index index.html;

    include /opt/private-ai/aureon/deploy/nginx/security-headers.conf;
    include /opt/private-ai/aureon/deploy/nginx/aureon-api.conf;

    # Hashed build assets never change: cache for a year. `expires` (not add_header) keeps the
    # server-level security headers inherited.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The PWA service worker and the entry point must always be revalidated.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
