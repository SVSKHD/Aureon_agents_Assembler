# api.spasta.online -> the Aureon API on 127.0.0.1:8000 (docs/24, Phase 22).
#
# Install (sudo, see docs/manual-setup.md "22"): include this file at http level, e.g.
#     sudo ln -s /opt/private-ai/aureon/deploy/nginx/api-spasta-online.conf \
#                /etc/nginx/sites-enabled/api-spasta-online.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# Reached ONLY through cloudflared (deploy/cloudflare/config.yml.example), on loopback.
# Cloudflare Access protects the hostname; Cloudflare adds `Cf-Access-Jwt-Assertion` to every
# request it lets through. This server REQUIRES that header (and that it is shaped like a
# JWT) on everything except the two Access bypass paths. The signature, audience and expiry
# are VERIFIED by cloudflared (`access.required` + `audTag`) and again by the app when
# CF_ACCESS_TEAM_DOMAIN + CF_ACCESS_AUD are set (app/core/cf_access.py): stock nginx cannot
# verify an RS256 JWT without extra modules, so it does the cheap presence/shape check here.

map $http_cf_access_jwt_assertion $aureon_cf_jwt_ok {
    default                                                  0;
    "~^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$"      1;
}

server {
    listen 127.0.0.1:8088;
    server_name api.spasta.online;

    # Same defaults as the /api/ location in aureon-api.conf.
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";
    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Only the API lives here.
    location / {
        return 404;
    }

    # Readiness detail stays on-box (healthchecks call 127.0.0.1:8000 directly).
    location = /api/health/ready {
        return 404;
    }

    # --- Access bypass paths: no JWT (Cloudflare Access "Bypass" policies) --------------
    # GitHub webhook receiver: HMAC-SHA256 verified and idempotent in the app.
    location = /api/v1/github/webhooks {
        limit_except POST { deny all; }
        client_max_body_size 2m;   # GITHUB_WEBHOOK_MAX_BYTES (1 MiB) + headroom
        proxy_pass http://127.0.0.1:8000;
    }
    # Public, rate-limited, read-only endpoints.
    location ^~ /api/public/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }

    # Receipt uploads keep their larger body limit (see aureon-api.conf).
    location = /api/finance/attachments {
        if ($aureon_cf_jwt_ok = 0) { return 403; }
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
    }

    # --- Everything else needs the Access token -----------------------------------------
    location /api/ {
        if ($aureon_cf_jwt_ok = 0) { return 403; }
        # SSE (chat, trading and approval streams): never buffer, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://127.0.0.1:8000;
    }
}
