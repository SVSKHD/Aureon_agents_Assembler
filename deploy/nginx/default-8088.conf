# Catch-all for 127.0.0.1:8088: an unknown Host header gets no answer at all (444 closes the
# connection). Without an explicit default_server, nginx uses the first server block it read
# for the port (sites-enabled is read alphabetically, so that was api-spasta-online.conf), and
# a request for a name nobody configured landed on the API vhost.
#
# Served names: spasta.online, api.spasta.online, svskhd8.taila439d5.ts.net.
#
# Install (sudo):
#   sudo ln -s /opt/private-ai/aureon/deploy/nginx/default-8088.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 127.0.0.1:8088 default_server;
    server_name _;
    return 444;
}
