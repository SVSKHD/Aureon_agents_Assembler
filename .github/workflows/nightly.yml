# Nightly build, every day at 20:00 IST (14:30 UTC), on GitHub-hosted runners only.
#
# What the per-PR CI does not:
# - the database tests (`pytest -m db`) against a throwaway Postgres 16 + Redis 7.4;
# - a build of the server image (the `runtime` stage the API and workers run).
# Plus the usual lint and unit tests, on main as it is tonight.
#
# Nothing is deployed and no secret is used: deploys stay with the server's own poller
# (scripts/ops/deploy-poll.sh). A failed run shows in Aureon's DevOps feed as build.failed
# (app/services/devops.py, via the Actions sync). "Run workflow" starts one by hand.
name: Nightly build
on:
  schedule:
    - cron: "30 14 * * *" # 20:00 IST
  workflow_dispatch:
  # A change to this file runs it once on its PR, so it is proven before it runs at night.
  pull_request:
    paths: [".github/workflows/nightly.yml"]
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --platform linux app
      - run: pytest -q -m "not db"

  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aureon
          POSTGRES_PASSWORD: aureon-ci-only
          POSTGRES_DB: aureon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aureon" --health-interval 5s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      # A throwaway database in a throwaway container: never the real one.
      TEST_DATABASE_URL: postgresql+asyncpg://aureon:aureon-ci-only@127.0.0.1:5432/aureon_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m db

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the server image (not pushed anywhere)
        run: docker build --target runtime --build-arg GIT_SHA="${GITHUB_SHA}" -t aureon-agentic:nightly .
      - name: The app imports inside the image
        run: docker run --rm --entrypoint python aureon-agentic:nightly -c "import app.main"
