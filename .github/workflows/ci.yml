# Lint + tests on GitHub-hosted runners only (docs/deploy-automation.md). Deploys never run in
# Actions: the server pulls merged commits itself (scripts/ops/deploy-poll.sh), so no
# self-hosted runner exists and no PR (fork or not) can execute anything on the server.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -m "not db"
      # docs/ui-manifest.md: every route has x-ui (tests/test_ui_manifest.py, part of pytest
      # above) and the typed OpenAPI document is kept as an artifact for the frontend client.
      - run: python scripts/export_openapi.py --out openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          retention-days: 30
